name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minst privilegium: jobbene kan kun lese innholdet i repoet.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Security regression checks
        run: node --test tests/security.test.mjs
      - name: Known dependency vulnerabilities (high and critical)
        run: npm audit --audit-level=high
      - name: Build the Vercel deployment
        run: npm run build
        env:
          NITRO_PRESET: vercel
